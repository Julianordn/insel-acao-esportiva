<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - Sistema INSEL</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;

            display: flex;
            justify-content: center;
            align-items: center;

            min-height: 100vh;
        }

        .login-container {
            width: 100%;
            max-width: 400px;

            background-color: white;

            padding: 35px;

            border-radius: 10px;

            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
        }

        h1 {
            text-align: center;
            margin-bottom: 10px;
        }

        .subtitulo {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: bold;
        }

        input {
            width: 100%;

            padding: 12px;

            margin-bottom: 18px;

            border: 1px solid #ccc;
            border-radius: 6px;

            font-size: 16px;
        }

        button {
            width: 100%;

            padding: 12px;

            border: none;
            border-radius: 6px;

            background-color: #222;
            color: white;

            font-size: 16px;
            font-weight: bold;

            cursor: pointer;
        }

        button:hover {
            background-color: #444;
        }

        .erro {
            background-color: #f8d7da;
            color: #842029;

            padding: 10px;

            border-radius: 6px;

            margin-bottom: 20px;

            text-align: center;
        }

    </style>

</head>


<body>

    <div class="login-container">

        <h1>Sistema INSEL</h1>

        <div class="subtitulo">
            Acesso ao sistema
        </div>


        {% with mensagens = get_flashed_messages() %}

            {% if mensagens %}

                {% for mensagem in mensagens %}

                    <div class="erro">
                        {{ mensagem }}
                    </div>

                {% endfor %}

            {% endif %}

        {% endwith %}


        <form method="POST">

            <label for="usuario">
                Usuário
            </label>

            <input
                type="text"
                id="usuario"
                name="usuario"
                placeholder="Digite seu usuário"
                required
                autofocus
            >


            <label for="senha">
                Senha
            </label>

            <input
                type="password"
                id="senha"
                name="senha"
                placeholder="Digite sua senha"
                required
            >


            <button type="submit">
                Entrar
            </button>

        </form>

    </div>

</body>

</html>
